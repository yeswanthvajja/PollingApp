# Production Configuration for AWS
server.port=${PORT:8080}
spring.application.name=polling-app

# AWS RDS PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pollingdb}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration for AWS RDS
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate Configuration for Production
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Configuration - Use environment variables
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging Configuration for Production
logging.level.root=INFO
logging.level.com.polling=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# CORS Configuration - Update with your frontend URL
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator for Health Checks (AWS Load Balancer)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
